    function renderAnalytics() {
      const stats = getStats();
      return `<div class="page-head"><div><div class="eyebrow">Evidence, not guesses</div><h2>See where your preparation stands.</h2><p>Analytics use completed test responses only. Untested weeks and topics stay unlabelled rather than being assigned invented scores.</p></div></div><div class="grid grid-3"><div class="card stat-card"><div class="stat-label">Accuracy</div><div class="stat-value">${pct(stats.accuracy)}</div><div class="stat-foot">Across ${stats.answered} answered questions</div></div><div class="card stat-card"><div class="stat-label">Weakest topic</div><div class="stat-value" style="font-size:21px">${stats.evaluatedTopics.length ? escapeHTML(stats.evaluatedTopics.slice().sort((a, b) => a.accuracy - b.accuracy)[0].topic) : "—"}</div><div class="stat-foot">Only measured topics appear</div></div><div class="card stat-card"><div class="stat-label">Preparation streak</div><div class="stat-value">${stats.streak}</div><div class="stat-foot">Consecutive active days</div></div></div><div class="grid grid-2" style="margin-top:16px"><section class="card"><div class="section-title" style="margin-top:0"><h3>Score over time</h3><span class="muted small-text">Last 12 tests</span></div>${renderLineChart()}</section><section class="card"><div class="section-title" style="margin-top:0"><h3>Lowest-performing topics</h3><button class="link-btn" data-action="practice-weak">Practice weak areas →</button></div>${renderBarChart(stats.evaluatedTopics, "topic")}</section></div><section class="card" style="margin-top:16px"><div class="section-title" style="margin-top:0"><h3>Accuracy by week</h3><span class="muted small-text">Weeks without attempts are omitted from scoring</span></div>${stats.evaluatedWeeks.length ? renderBarChart(stats.evaluatedWeeks.map(item => ({ ...item, label: `Week ${item.week}` })), "label", 12) : emptyState("▦", "No week performance yet", "Complete a mock to compare your weeks.", "start-full", "Take a mock")}</section>`;
    }

    function renderSettings() {
      return `<div class="page-head"><div><div class="eyebrow">Portable by default</div><h2>Settings and data.</h2><p>Everything is local. Export a backup before moving browsers or resetting activity.</p></div></div><div class="grid grid-2"><section class="card"><div class="section-title" style="margin-top:0"><h3>Appearance</h3></div><div class="toggle-line"><span><strong>Dark mode</strong><small class="muted" style="display:block">Use a lower-light interface.</small></span><button class="toggle ${state.theme === "dark" ? "on" : ""}" data-action="toggle-theme" aria-label="Toggle dark mode"></button></div><div class="toggle-line"><span><strong>Reduced motion</strong><small class="muted" style="display:block">Honours your browser’s motion preference automatically.</small></span><span class="tag">CSS media setting</span></div></section><section class="card"><div class="section-title" style="margin-top:0"><h3>Imported dataset</h3></div><div class="summary-line"><span>Questions</span><strong>${DATA_REPORT.total}</strong></div><div class="summary-line"><span>Weeks</span><strong>12</strong></div><div class="summary-line"><span>Validation</span><strong style="color:${DATA_REPORT.valid ? "var(--success)" : "var(--danger)"}">${DATA_REPORT.valid ? "Passed" : `${DATA_REPORT.errors.length} issue(s)`}</strong></div><div class="summary-line"><span>Exact duplicate texts</span><strong>${DATA_REPORT.duplicates.length}</strong></div></section></div><div class="section-title"><h3>Backup and reset</h3></div><section class="card"><div class="actions"><button class="btn primary" data-action="export">Export progress JSON</button><label class="btn"><input class="file-input" id="import-file" type="file" accept="application/json">Import progress JSON</label><button class="btn" data-action="reset-history">Reset test history</button><button class="btn" data-action="clear-bookmarks">Clear bookmarks</button><button class="btn" data-action="clear-mistakes">Clear mistake book</button><button class="btn danger" data-action="reset-all">Reset all local data</button></div><p class="muted small-text" style="margin:16px 0 0">Exports include tests, scores, mistakes, bookmarks, statistics inputs and the current resumable test. No network request is made.</p></section>`;
    }

    function renderNavigator(session) {
      return `<aside class="card navigator-card"><h3>Question navigator</h3><p class="muted small-text">${session.questionIds.length} questions · ${Object.values(session.answers).filter(hasAnswer).length} answered</p><div class="navigator-grid">${session.questionIds.map((id, index) => { const answered = hasAnswer(session.answers[id]); const review = session.marked.includes(id); const current = index === session.currentIndex; return `<button class="nav-q ${answered ? "answered" : ""} ${review ? "review" : ""} ${current ? "current" : ""}" data-action="jump-question" data-index="${index}" aria-label="Question ${index + 1}">${index + 1}</button>`; }).join("")}</div><div class="legend"><span><i></i>Unanswered</span><span><i class="answered"></i>Answered</span><span><i class="review"></i>Marked for review</span></div><div class="shortcuts"><strong class="small-text">Keyboard shortcuts</strong><div class="shortcut-grid"><span><kbd>1–4</kbd> option</span><span><kbd>← →</kbd> navigate</span><span><kbd>M</kbd> mark</span><span><kbd>C</kbd> clear</span><span><kbd>Enter</kbd> confirm / next</span></div></div></aside>`;
    }
    function renderQuestionOptions(question, session) {
      const selected = answerArray(getSelected(session, question)); const checked = Boolean(session.checked[question.id]); const isCorrect = checked && answersEqual(selected, question.answer); const order = getOptionOrder(question, session);
      return `<div class="options">${order.map(originalIndex => { const isSelected = selected.includes(originalIndex); const isCorrectOption = checked && answerArray(question.answer).includes(originalIndex); const optionClass = checked ? (isCorrectOption ? "correct" : (isSelected ? "incorrect" : "")) : (isSelected ? "selected" : ""); return `<button class="option ${optionClass}" data-action="select-option" data-index="${originalIndex}" ${checked ? "aria-disabled=\"true\"" : ""}><span class="option-letter">${LETTERS[originalIndex]}</span><span>${escapeHTML(question.options[originalIndex])}</span></button>`; }).join("")}</div>${checked ? `<div class="feedback ${isCorrect ? "correct" : "incorrect"}"><strong>${isCorrect ? "✓ Correct" : "✕ Incorrect"}</strong><div>Correct answer: ${escapeHTML(optionText(question, question.answer))}</div>${question.explanation ? `<div style="margin-top:6px">${escapeHTML(question.explanation)}</div>` : ""}</div>` : ""}`;
    }
    function renderSession() {
      const session = state.currentTest; if (!session || !session.questionIds.length) return emptyState("◌", "No active test", "Start a mock from the builder or dashboard.", "open-builder", "Build a mock");
      const question = getCurrentQuestion(); const currentIndex = Number(session.currentIndex) || 0; const selected = getSelected(session, question); const checked = Boolean(session.checked[question.id]); const isLast = currentIndex === session.questionIds.length - 1;
      const progress = (currentIndex + 1) / session.questionIds.length * 100;
      return `<div class="exam-shell"><div class="exam-top"><div><div class="eyebrow">${session.mode === "exam" ? "Real exam mode" : "Guided practice"}</div><h2>${escapeHTML(session.label)}</h2></div><div class="exam-status"><span class="tag ${session.mode === "exam" ? "accent" : ""}">${session.mode === "exam" ? "Answers hidden" : "Feedback after check"}</span>${session.mode === "exam" ? `<span class="timer" id="session-timer">${formatDuration(Math.max(0, session.duration - getSessionElapsed(session)))}</span>` : ""}</div></div><div class="progress" style="margin-bottom:16px"><span style="width:${progress}%"></span></div><button class="btn secondary small mobile-nav-toggle" data-action="toggle-mobile-navigator">Question navigator</button><div class="exam-grid"><section class="card question-card"><div class="question-meta"><span class="question-number">Question ${currentIndex + 1} of ${session.questionIds.length}</span><span class="question-topic">Week ${question.week} · ${escapeHTML(question.topic)}</span></div><h2 class="question-text">${escapeHTML(question.question)}</h2><p class="question-hint">${question.type === "multi" ? "Select all options that apply." : "Select one option."}</p>${renderQuestionOptions(question, session)}<div class="exam-controls"><div class="control-group"><button class="btn small" data-action="previous" ${currentIndex === 0 ? "disabled" : ""}>← Previous</button><button class="btn small" data-action="next">${isLast ? (session.mode === "practice" ? "Finish practice" : "Review submission") : "Next →"}</button></div><div class="control-group"><button class="btn small ${session.marked.includes(question.id) ? "secondary" : ""}" data-action="mark">${session.marked.includes(question.id) ? "★ Marked" : "☆ Mark for review"}</button><button class="btn small" data-action="clear-answer" ${hasAnswer(selected) ? "" : "disabled"}>Clear answer</button>${session.mode === "practice" ? (checked ? `<button class="btn positive small" data-action="next">${isLast ? "Finish practice" : "Next question"}</button>` : `<button class="btn primary small" data-action="check-practice" ${hasAnswer(selected) ? "" : "disabled"}>Check answer</button>`) : `<button class="btn primary small" data-action="submit">Submit test</button>`}</div></div></section>${renderNavigator(session)}</div></div>`;
    }

    function renderReviewItem(item) {
      const question = getQuestion(item.id); if (!question) return "";
      const resultClass = item.unanswered ? "mid" : (item.correct ? "" : "low"); const label = item.unanswered ? "Unanswered" : (item.correct ? "Correct" : "Review this concept");
      return `<article class="review-item"><div class="review-item-head"><div><h4>${question.number}. ${escapeHTML(question.question)}</h4><div class="actions"><span class="tag accent">Week ${question.week}</span><span class="tag">${escapeHTML(question.topic)}</span></div></div><span class="score-pill ${resultClass}">${label}</span></div><div class="review-answer"><div class="answer-line ${item.correct ? "correct" : (item.unanswered ? "" : "wrong")}"><strong>Your answer:</strong> ${escapeHTML(optionText(question, item.userAnswer))}</div><div class="answer-line correct"><strong>Correct answer:</strong> ${escapeHTML(optionText(question, question.answer))}</div>${question.explanation ? `<div class="muted small-text"><strong>Explanation:</strong> ${escapeHTML(question.explanation)}</div>` : ""}</div><div class="actions" style="margin-top:12px"><button class="btn small secondary" data-action="retry-question" data-id="${question.id}">Retry question</button><button class="icon-btn" data-action="toggle-bookmark" data-id="${question.id}" aria-label="Save question">${state.bookmarks.includes(question.id) ? "★" : "☆"}</button></div></article>`;
    }
    function renderResults() {
      const result = state.lastResult; if (!result) return emptyState("✓", "No result selected", "Complete a test to see its results.", "start-full", "Start a mock");
      const tone = result.scorePct >= 80 ? "Excellent performance" : result.scorePct >= 50 ? "Solid foundation" : "A useful baseline";
      const byWeek = new Map(); result.items.forEach(item => { const question = getQuestion(item.id); if (!question) return; if (!byWeek.has(question.week)) byWeek.set(question.week, { correct: 0, total: 0 }); const group = byWeek.get(question.week); group.total += 1; if (item.correct) group.correct += 1; });
      return `<div class="page-head"><div><div class="eyebrow">Result recorded</div><h2>${escapeHTML(result.label || "Your test")}</h2><p>${escapeHTML(formatDate(result.submittedAt, true))} · ${result.mode === "exam" ? "Exam mode" : "Practice mode"}${result.reason === "time" ? " · Auto-submitted when the timer ended" : ""}</p></div><div class="actions"><button class="btn primary" data-action="start-full">Take another mock</button><button class="btn" data-action="back-dashboard">Dashboard</button></div></div><section class="card result-hero"><div class="result-score">${pct(result.scorePct)}</div><h2>${tone}</h2><p>${result.correct} correct out of ${result.total} questions</p><div class="result-metrics"><div class="result-metric"><strong>${result.correct}</strong><span>Correct</span></div><div class="result-metric"><strong>${result.total - result.correct - result.unanswered}</strong><span>Incorrect</span></div><div class="result-metric"><strong>${result.unanswered}</strong><span>Unanswered</span></div><div class="result-metric"><strong>${pct(result.accuracyPct)}</strong><span>Accuracy</span></div><div class="result-metric"><strong>${formatDuration(result.timeTaken)}</strong><span>Time taken</span></div></div></section><div class="grid grid-2" style="margin-top:16px"><section class="card"><div class="section-title" style="margin-top:0"><h3>Week performance</h3><span class="muted small-text">Only weeks in this test</span></div>${[...byWeek.entries()].map(([week, group]) => `<div class="week-row"><strong>Week ${week}</strong><div class="progress"><span style="width:${group.correct / group.total * 100}%"></span></div><span>${pct(group.correct / group.total * 100)}</span></div>`).join("")}</section><section class="card"><div class="section-title" style="margin-top:0"><h3>What next?</h3></div><p class="muted small-text">Incorrect answers are now in your Mistake Book. Bookmark concepts you want to revisit and use the topic explorer to build a focused practice set.</p><div class="actions"><button class="btn secondary" data-action="practice-mistakes">Practice mistakes</button><button class="btn" data-nav="analytics">View analytics</button></div></section></div><div class="section-title"><h3>Question-by-question review</h3><span class="muted small-text">Correct answers are visible here after submission.</span></div><section>${result.items.map(renderReviewItem).join("")}</section>`;
    }

    function renderView() {
      switch (view) {
        case "builder": return renderBuilder();
        case "weeks": return renderWeeks();
        case "week-detail": return renderWeekDetail();
        case "topics": return renderTopics();
        case "search": return renderSearch();
        case "mistakes": return renderMistakes();
        case "saved": return renderSaved();
        case "daily": return renderDaily();
        case "analytics": return renderAnalytics();
        case "settings": return renderSettings();
        case "session": return renderSession();
        case "results": return renderResults();
        default: return renderDashboard();
      }
    }
    function render() {
      updateTheme(); activeNav();
      const title = document.getElementById("topbar-title"); if (title) title.textContent = VIEW_TITLES[view] || VIEW_TITLES.dashboard;
      const globalSearch = document.getElementById("global-search"); if (globalSearch && globalSearch.value !== state.search) globalSearch.value = state.search;
      document.getElementById("main-content").innerHTML = renderView();
      if (view === "session" && state.currentTest?.mode === "exam") startSessionTimer();
    }

    function startWithDiscard(callback) {
      if (!state.currentTest) { callback(); return; }
      showConfirm("Start a new test?", "Your current test will remain available only if you choose Continue instead. Starting a new test will replace it.", "Start new test", () => { state.currentTest = null; persist(); callback(); });
    }
    function startFullMock() {
      startWithDiscard(() => makeSession(QUESTIONS.map(question => question.id), "exam", { label: "Full 12-week mock", randomOptions: true }));
    }
    function startPractice(ids, label, kind = "mock") {
      const unique = [...new Set(ids)].filter(id => getQuestion(id));
      if (!unique.length) { showToast("There are no questions available for this practice set yet."); return; }
      startWithDiscard(() => makeSession(shuffle(unique), "practice", { label, kind, randomOptions: true }));
    }
    function submitBuilder(form) {
      const formData = new FormData(form); let weeks = formData.getAll("weeks").map(Number).filter(Number.isInteger);
      if (!weeks.length) weeks = WEEK_LIST.slice();
      const topic = String(formData.get("topic") || "all"); const mode = formData.get("mode") === "exam" ? "exam" : "practice";
      const randomOptions = formData.get("randomOptions") === "on"; const requestedCount = clamp(Number(formData.get("count")) || 20, 1, QUESTIONS.length);
      state.builder = { weeks, topic, count: requestedCount, mode, randomOptions }; persist();
      let pool = QUESTIONS.filter(question => weeks.includes(question.week) && (topic === "all" || question.topic === topic));
      const uniquePool = []; const seen = new Set();
      pool.forEach(question => { const key = normalize(question.question); if (!seen.has(key)) { seen.add(key); uniquePool.push(question); } });
      if (!uniquePool.length) { showToast("No questions match that combination. Try another topic or week."); return; }
      const selected = shuffle(uniquePool).slice(0, Math.min(requestedCount, uniquePool.length));
      const weekLabel = weeks.length === 12 ? "Weeks 1–12" : `Weeks ${weeks.join(", ")}`;
      startWithDiscard(() => makeSession(selected.map(question => question.id), mode, { label: `${mode === "exam" ? "Exam" : "Practice"} · ${weekLabel}`, randomOptions }));
    }
    function startDaily() {
      const key = localDateKey(); const ids = state.daily[key]?.questionIds || dailyQuestionIds(key); state.daily[key] = { ...(state.daily[key] || {}), questionIds: ids }; persist();
      startWithDiscard(() => makeSession(ids, "exam", { label: "Today’s challenge", kind: "daily", dailyKey: key, randomOptions: true }));
    }
    function practiceMistakes() { startPractice(Object.keys(state.mistakes), "Mistake book practice", "mistakes"); }
    function practiceSaved() { startPractice(state.bookmarks, "Saved questions practice", "saved"); }
    function practiceWeakAreas() {
      const stats = getStats(); const weakTopics = stats.evaluatedTopics.slice().sort((a, b) => a.accuracy - b.accuracy).slice(0, 3).map(item => item.topic);
      const weakTopicIds = QUESTIONS.filter(question => weakTopics.includes(question.topic)).map(question => question.id);
      startPractice([...Object.keys(state.mistakes), ...weakTopicIds], "Weak area practice", "weak");
    }
    function practiceWeek(week) { startPractice(QUESTIONS.filter(question => question.week === Number(week)).map(question => question.id), `Week ${week} practice`, "week"); }
    function practiceTopic(topic) { startPractice(QUESTIONS.filter(question => question.topic === topic).map(question => question.id), `${topic} practice`, "topic"); }
    function retryQuestion(id) { startPractice([id], "Retry question", "retry"); }
    function toggleBookmark(id) {
      if (!getQuestion(id)) return;
      state.bookmarks = state.bookmarks.includes(id) ? state.bookmarks.filter(value => value !== id) : [...state.bookmarks, id]; persist(); render();
      showToast(state.bookmarks.includes(id) ? "Question saved." : "Question removed from saved questions.");
    }
    function showQuestionDetails(id) {
      const question = getQuestion(id); if (!question) return;
      modalConfirm = null;
      document.getElementById("modal-root").innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="eyebrow">Week ${question.week} · ${escapeHTML(question.topic)}</div><h3 style="margin-top:6px">${escapeHTML(question.question)}</h3><div class="options" style="margin-top:16px">${question.options.map((option, index) => `<div class="option ${answerArray(question.answer).includes(index) ? "correct" : ""}" style="cursor:default"><span class="option-letter">${LETTERS[index]}</span><span>${escapeHTML(option)}</span></div>`).join("")}</div><p style="margin-top:16px">${question.explanation ? escapeHTML(question.explanation) : "No explanation was provided in the source material."}</p><small class="muted">${escapeHTML(question.source)}</small><div class="modal-actions" style="margin-top:20px"><button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="retry-question" data-id="${question.id}">Practice this question</button></div></div></div>`;
    }
    function exportProgress() {
      const stats = getStats(); const serialStats = { ...stats, weekStats: [...stats.weekStats.entries()], topicStats: [...stats.topicStats.entries()] };
      const payload = { app: "IoT Prep Studio", version: 1, exportedAt: new Date().toISOString(), data: state, statistics: serialStats };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }); const url = URL.createObjectURL(blob); const anchor = document.createElement("a");
      anchor.href = url; anchor.download = "iot_progress.json"; document.body.appendChild(anchor); anchor.click(); anchor.remove(); URL.revokeObjectURL(url); showToast("Progress exported as iot_progress.json.");
    }
    function importProgress(file) {
      const reader = new FileReader(); reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result); const incoming = payload.data || payload.state || payload;
          if (!incoming || typeof incoming !== "object" || !Array.isArray(incoming.tests) || !Array.isArray(incoming.bookmarks)) throw new Error("invalid format");
          state = { ...structuredClone(DEFAULT_STATE), ...incoming, builder: { ...DEFAULT_STATE.builder, ...(incoming.builder || {}) } }; persist(); render(); showToast("Progress imported successfully.");
        } catch (error) { showToast("That file could not be imported. Use an iot_progress.json export."); }
      }; reader.readAsText(file);
    }
    function clearMistakes() { if (!Object.keys(state.mistakes).length) { showToast("Your mistake book is already empty."); return; } showConfirm("Clear mistake book?", "All recorded incorrect-question entries will be deleted. This cannot be undone unless you have an export.", "Clear mistakes", () => { state.mistakes = {}; persist(); render(); showToast("Mistake book cleared."); }); }
    function clearBookmarks() { if (!state.bookmarks.length) { showToast("There are no saved questions to clear."); return; } showConfirm("Clear saved questions?", "All bookmarks will be removed from this browser.", "Clear bookmarks", () => { state.bookmarks = []; persist(); render(); showToast("Saved questions cleared."); }); }
    function resetHistory() { if (!state.tests.length) { showToast("There is no test history to reset."); return; } showConfirm("Reset test history?", "Scores, analytics and completed-test records will be removed. Your bookmarks and mistake book will remain.", "Reset history", () => { state.tests = []; state.lastResult = null; state.activityDays = []; persist(); setView("dashboard"); showToast("Test history reset."); }); }
    function resetAll() { showConfirm("Reset all local data?", "This will remove tests, progress, bookmarks, mistakes, daily results and any resumable test from this browser.", "Reset everything", () => { state = structuredClone(DEFAULT_STATE); persist(); setView("dashboard"); showToast("All local data reset."); }); }

    function handleAction(actionElement) {
      const action = actionElement.dataset.action;
      switch (action) {
        case "toggle-theme": state.theme = state.theme === "dark" ? "light" : "dark"; persist(); render(); break;
        case "start-full": startFullMock(); break;
        case "open-builder": state.selectedWeek = null; state.selectedTopic = null; setView("builder"); break;
        case "continue-session": if (state.currentTest) setView("session"); else showToast("There is no saved test to continue."); break;
        case "start-new": startWithDiscard(() => setView("builder")); break;
        case "start-daily": startDaily(); break;
        case "practice-mistakes": practiceMistakes(); break;
        case "practice-saved": practiceSaved(); break;
        case "practice-weak": practiceWeakAreas(); break;
        case "practice-week": practiceWeek(actionElement.dataset.week); break;
        case "practice-topic": practiceTopic(actionElement.dataset.topic); break;
        case "retry-question": closeModal(); retryQuestion(actionElement.dataset.id); break;
        case "toggle-bookmark": toggleBookmark(actionElement.dataset.id); break;
        case "week-detail": state.selectedWeek = Number(actionElement.dataset.week); setView("week-detail"); break;
        case "topic-detail": state.selectedTopic = actionElement.dataset.topic; setView("topics"); break;
        case "back-topics": state.selectedTopic = null; render(); break;
        case "back-weeks": setView("weeks"); break;
        case "clear-search": state.search = ""; render(); break;
        case "open-weeks": state.selectedWeek = null; setView("weeks"); break;
        case "view-question": showQuestionDetails(actionElement.dataset.id); break;
        case "select-option": { const session = state.currentTest; const question = getCurrentQuestion(); if (session && question && !session.checked[question.id]) setSelected(session, question, Number(actionElement.dataset.index)); break; }
        case "previous": moveQuestion(-1); break;
        case "next": moveQuestion(1); break;
        case "jump-question": if (state.currentTest) { state.currentTest.currentIndex = Number(actionElement.dataset.index); persist(); render(); } break;
        case "toggle-mobile-navigator": document.querySelector(".navigator-card")?.classList.toggle("mobile-open"); break;
        case "mark": markCurrent(); break;
        case "clear-answer": clearCurrent(); break;
        case "check-practice": checkPractice(); break;
        case "submit": submitRequest(); break;
        case "export": exportProgress(); break;
        case "clear-mistakes": clearMistakes(); break;
        case "clear-bookmarks": clearBookmarks(); break;
        case "reset-history": resetHistory(); break;
        case "reset-all": resetAll(); break;
        case "back-dashboard": setView("dashboard"); break;
        case "modal-cancel": closeModal(); break;
        case "modal-confirm": { const callback = modalConfirm; closeModal(); if (callback) callback(); break; }
        case "close-modal": closeModal(); break;
        default: break;
      }
    }

    document.addEventListener("click", event => {
      const navButton = event.target.closest("[data-nav]");
      if (navButton) {
        const nextView = navButton.dataset.nav; state.selectedWeek = nextView === "weeks" ? null : state.selectedWeek; state.selectedTopic = nextView === "topics" ? state.selectedTopic : null; setView(nextView); document.getElementById("sidebar").style.display = ""; return;
      }
      const actionElement = event.target.closest("[data-action]"); if (actionElement) handleAction(actionElement);
    });
    document.addEventListener("submit", event => { if (event.target.id === "mock-form") { event.preventDefault(); submitBuilder(event.target); } });
    document.addEventListener("input", event => {
      if (event.target.id === "global-search" || event.target.id === "page-search") {
        state.search = event.target.value; if (view !== "search") view = "search"; render(); const input = document.getElementById(event.target.id === "global-search" ? "global-search" : "page-search"); if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    });
    document.addEventListener("change", event => { if (event.target.id === "import-file" && event.target.files?.[0]) importProgress(event.target.files[0]); });
    document.addEventListener("keydown", event => {
      if (event.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) { event.preventDefault(); document.getElementById("global-search")?.focus(); return; }
      if (view !== "session" || !state.currentTest || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
      const key = event.key.toLowerCase();
      if (["1", "2", "3", "4"].includes(event.key)) { const question = getCurrentQuestion(); const order = getOptionOrder(question, state.currentTest); const originalIndex = order[Number(event.key) - 1]; if (originalIndex !== undefined && !state.currentTest.checked[question.id]) setSelected(state.currentTest, question, originalIndex); }
      else if (event.key === "ArrowRight") { event.preventDefault(); moveQuestion(1); }
      else if (event.key === "ArrowLeft") { event.preventDefault(); moveQuestion(-1); }
      else if (key === "m") markCurrent();
      else if (key === "c") clearCurrent();
      else if (event.key === "Enter") { event.preventDefault(); if (state.currentTest.mode === "practice" && !state.currentTest.checked[getCurrentQuestion().id]) checkPractice(); else moveQuestion(1); }
    });
    document.getElementById("mobile-menu").addEventListener("click", () => {
      const sidebar = document.getElementById("sidebar"); const isOpen = sidebar.style.display === "flex"; sidebar.style.display = isOpen ? "" : "flex"; if (!isOpen) { sidebar.style.position = "fixed"; sidebar.style.left = "0"; sidebar.style.top = "0"; sidebar.style.bottom = "0"; sidebar.style.boxShadow = "var(--shadow-md)"; }
    });
    document.getElementById("theme-toggle").addEventListener("click", () => handleAction({ dataset: { action: "toggle-theme" } }));
    render();
  </script>
</body>
</html>
