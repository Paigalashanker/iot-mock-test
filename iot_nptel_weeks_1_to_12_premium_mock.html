<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>IoT Prep Studio · NPTEL Mock Tests</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #eef3f8;
      --ink: #132033;
      --muted: #64748b;
      --line: #dce5ef;
      --accent: #1264a3;
      --accent-2: #0b7d68;
      --accent-soft: #e7f2fb;
      --success: #16794c;
      --success-soft: #e7f6ee;
      --danger: #be3d4d;
      --danger-soft: #fff0f2;
      --warning: #a56608;
      --warning-soft: #fff7e6;
      --shadow-sm: 0 2px 10px rgba(25, 45, 75, .06);
      --shadow-md: 0 16px 40px rgba(25, 45, 75, .10);
      --radius: 18px;
      --radius-sm: 11px;
      --sidebar: 260px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0b1220;
      --surface: #121c2d;
      --surface-2: #1b293d;
      --ink: #ecf3fb;
      --muted: #9aabc0;
      --line: #2b3b52;
      --accent: #62b4ef;
      --accent-2: #5dd1b5;
      --accent-soft: #17324b;
      --success: #5dd1a1;
      --success-soft: #163b2f;
      --danger: #ff8290;
      --danger-soft: #45202a;
      --warning: #edbd65;
      --warning-soft: #43351d;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, .20);
      --shadow-md: 0 18px 45px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }
    a { color: inherit; }
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: var(--sidebar); background: var(--surface); border-right: 1px solid var(--line); padding: 26px 16px 18px; display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; z-index: 20; }
    .brand { display: flex; gap: 12px; align-items: center; padding: 2px 10px 28px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #1171b9, #0b7d68); color: white; display: grid; place-items: center; font-weight: 800; letter-spacing: -.08em; box-shadow: 0 8px 18px rgba(18, 100, 163, .25); }
    .brand strong { display: block; font-size: 15px; letter-spacing: -.02em; }
    .brand span { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .nav-label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: 12px 12px 7px; }
    .nav { display: grid; gap: 4px; }
    .nav button { border: 0; background: transparent; color: var(--muted); border-radius: 11px; padding: 10px 12px; display: flex; gap: 11px; align-items: center; text-align: left; transition: background .18s ease, color .18s ease, transform .18s ease; }
    .nav button:hover { background: var(--surface-2); color: var(--ink); transform: translateX(2px); }
    .nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 750; }
    .nav-icon { width: 20px; text-align: center; font-size: 16px; }
    .sidebar-footer { margin-top: auto; border-top: 1px solid var(--line); padding: 16px 10px 0; color: var(--muted); font-size: 12px; }
    .sidebar-footer strong { color: var(--ink); display: block; margin-bottom: 2px; }
    .main-wrap { min-width: 0; flex: 1; }
    .topbar { height: 76px; display: flex; align-items: center; gap: 16px; padding: 0 34px; background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 15; backdrop-filter: blur(14px); }
    .mobile-menu { display: none; }
    .topbar-title { min-width: 150px; }
    .eyebrow { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
    .topbar-title h1 { font-size: 18px; margin: 1px 0 0; letter-spacing: -.035em; }
    .search-global { flex: 1; max-width: 520px; margin-left: auto; position: relative; }
    .search-global input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 42px 10px 38px; box-shadow: var(--shadow-sm); }
    .search-global .search-glyph { position: absolute; left: 13px; top: 9px; color: var(--muted); }
    .search-global kbd { position: absolute; right: 10px; top: 8px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 10px; }
    .icon-btn { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; display: grid; place-items: center; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .icon-btn:hover { transform: translateY(-1px); border-color: var(--accent); background: var(--accent-soft); }
    .content { max-width: 1440px; margin: 0 auto; padding: 34px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .page-head h2 { margin: 3px 0 5px; font-size: clamp(26px, 3vw, 40px); line-height: 1.08; letter-spacing: -.055em; }
    .page-head p { margin: 0; color: var(--muted); max-width: 690px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 15px; border-radius: 10px; font-weight: 750; transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); border-color: var(--accent); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 7px 18px color-mix(in srgb, var(--accent) 24%, transparent); }
    .btn.secondary { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .btn.positive { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
    .btn.danger { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
    .btn.small { padding: 7px 10px; font-size: 12px; }
    .grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 22px; }
    .card h3, .card h4 { margin: 0; letter-spacing: -.025em; }
    .card h3 { font-size: 16px; }
    .card h4 { font-size: 14px; }
    .muted { color: var(--muted); }
    .small-text { font-size: 12px; }
    .hero { padding: 32px; border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line)); background: linear-gradient(135deg, var(--surface), color-mix(in srgb, var(--accent-soft) 75%, var(--surface))); position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; width: 260px; height: 260px; right: -75px; top: -105px; border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); border-radius: 50%; box-shadow: 0 0 0 24px color-mix(in srgb, var(--accent) 4%, transparent), 0 0 0 48px color-mix(in srgb, var(--accent) 3%, transparent); }
    .hero-inner { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 30px; align-items: center; }
    .hero h2 { font-size: clamp(28px, 4vw, 50px); max-width: 680px; margin: 5px 0 11px; letter-spacing: -.065em; line-height: 1.02; }
    .hero p { max-width: 650px; color: var(--muted); margin: 0 0 20px; }
    .hero-meta { min-width: 190px; text-align: right; }
    .hero-meta strong { display: block; font-size: 38px; letter-spacing: -.06em; }
    .hero-meta span { color: var(--muted); font-size: 12px; }
    .stat-card { min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .stat-value { font-size: 31px; letter-spacing: -.06em; font-weight: 800; margin-top: 4px; }
    .stat-foot { color: var(--muted); font-size: 11px; }
    .progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .progress > span { height: 100%; display: block; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .45s ease; }
    .progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; margin-bottom: 8px; }
    .section-title { display: flex; justify-content: space-between; gap: 15px; align-items: center; margin: 28px 0 13px; }
    .section-title h3 { font-size: 17px; margin: 0; letter-spacing: -.035em; }
    .section-title a, .link-btn { color: var(--accent); font-size: 12px; font-weight: 750; border: 0; background: none; padding: 0; }
    .quick-card { display: flex; flex-direction: column; gap: 8px; min-height: 137px; }
    .quick-card .quick-icon { width: 35px; height: 35px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 17px; }
    .week-row { display: grid; grid-template-columns: 76px 1fr 56px; align-items: center; gap: 12px; margin: 13px 0; }
    .week-row strong { font-size: 12px; }
    .week-row span { color: var(--muted); font-size: 11px; text-align: right; }
    .history-list { display: grid; gap: 0; }
    .history-item { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .history-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .history-item:first-child { padding-top: 4px; }
    .history-item strong { font-size: 13px; display: block; }
    .history-item small { color: var(--muted); }
    .score-pill { padding: 5px 9px; border-radius: 99px; font-weight: 800; font-size: 12px; background: var(--success-soft); color: var(--success); }
    .score-pill.low { background: var(--danger-soft); color: var(--danger); }
    .score-pill.mid { background: var(--warning-soft); color: var(--warning); }
    .table-like { width: 100%; border-collapse: collapse; }
    .table-like th, .table-like td { text-align: left; padding: 11px 9px; border-bottom: 1px solid var(--line); font-size: 12px; vertical-align: top; }
    .table-like th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
    .table-like tr:last-child td { border-bottom: 0; }
    .empty { padding: 36px 18px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
    .empty .empty-icon { font-size: 27px; margin-bottom: 8px; }
    .empty h4 { margin: 0 0 4px; font-size: 15px; }
    .empty p { max-width: 430px; margin: 0 auto 15px; color: var(--muted); font-size: 13px; }
    .builder { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; align-items: start; }
    .field { display: grid; gap: 6px; margin-bottom: 17px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 12px; font-weight: 800; }
    .field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 11px; }
    .field-help { color: var(--muted); font-size: 11px; }
    .week-checks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .check-chip { display: flex; gap: 7px; align-items: center; border: 1px solid var(--line); padding: 9px 10px; border-radius: 10px; background: var(--surface); cursor: pointer; font-size: 12px; transition: border-color .18s ease, background .18s ease; }
    .check-chip:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .check-chip input { accent-color: var(--accent); }
    .radio-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .radio-choice { flex: 1; min-width: 130px; }
    .radio-choice input { position: absolute; opacity: 0; }
    .radio-choice span { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 11px; text-align: center; cursor: pointer; font-weight: 750; font-size: 12px; }
    .radio-choice input:checked + span { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .toggle-line { display: flex; justify-content: space-between; gap: 15px; align-items: center; padding: 10px 0; }
    .toggle { width: 42px; height: 24px; border-radius: 99px; border: 0; background: var(--line); position: relative; padding: 0; }
    .toggle::after { content: ""; width: 18px; height: 18px; background: var(--surface); position: absolute; left: 3px; top: 3px; border-radius: 50%; transition: transform .18s ease; box-shadow: var(--shadow-sm); }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(18px); }
    .selection-summary { display: grid; gap: 11px; }
    .summary-line { display: flex; justify-content: space-between; gap: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .summary-line:last-child { border-bottom: 0; padding-bottom: 0; }
    .summary-line span { color: var(--muted); }
    .exam-shell { max-width: 1100px; margin: 0 auto; }
    .exam-top { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 15px; }
    .exam-top h2 { font-size: 23px; letter-spacing: -.045em; margin: 0; }
    .exam-status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .timer { padding: 8px 11px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-weight: 850; letter-spacing: .06em; min-width: 84px; text-align: center; }
    .timer.warn { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
    .exam-grid { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 16px; align-items: start; }
    .question-card { min-height: 480px; display: flex; flex-direction: column; }
    .question-meta { display: flex; justify-content: space-between; gap: 13px; align-items: center; margin-bottom: 24px; }
    .question-number { color: var(--accent); font-weight: 850; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    .question-topic { color: var(--muted); font-size: 11px; }
    .question-text { font-size: clamp(20px, 2.5vw, 28px); line-height: 1.25; letter-spacing: -.04em; margin: 0 0 23px; }
    .question-hint { color: var(--muted); font-size: 12px; margin: -13px 0 17px; }
    .options { display: grid; gap: 10px; }
    .option { display: grid; grid-template-columns: 31px 1fr; gap: 11px; align-items: center; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; border-radius: 12px; padding: 13px; transition: border-color .18s ease, background .18s ease, transform .18s ease; }
    .option:hover { border-color: var(--accent); transform: translateX(2px); }
    .option-letter { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-weight: 800; font-size: 12px; }
    .option.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .option.selected .option-letter { background: var(--accent); color: #fff; }
    .option.correct { border-color: var(--success); background: var(--success-soft); color: var(--success); }
    .option.incorrect { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .feedback { margin-top: 17px; border-radius: 12px; padding: 13px 15px; font-size: 13px; }
    .feedback.correct { background: var(--success-soft); color: var(--success); }
    .feedback.incorrect { background: var(--danger-soft); color: var(--danger); }
    .feedback strong { display: block; margin-bottom: 3px; }
    .exam-controls { margin-top: auto; padding-top: 25px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .control-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .navigator-card { position: sticky; top: 95px; }
    .mobile-nav-toggle { display: none; }
    .navigator-card h3 { margin-bottom: 4px; }
    .navigator-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin-top: 16px; }
    .nav-q { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; font-size: 11px; font-weight: 800; position: relative; }
    .nav-q.current { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 13%, transparent); }
    .nav-q.answered { background: var(--accent-soft); color: var(--accent); }
    .nav-q.review { box-shadow: inset 0 -3px 0 var(--warning); }
    .legend { display: grid; gap: 7px; margin-top: 17px; color: var(--muted); font-size: 11px; }
    .legend span { display: flex; align-items: center; gap: 7px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); }
    .legend i.answered { background: var(--accent-soft); border-color: var(--accent); }
    .legend i.review { border-bottom: 3px solid var(--warning); }
    .shortcuts { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .shortcut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    .shortcut-grid span { font-size: 10px; color: var(--muted); }
    kbd { border: 1px solid var(--line); background: var(--surface-2); border-radius: 4px; padding: 1px 5px; color: var(--ink); font-size: 10px; }
    .result-hero { text-align: center; padding: 34px; }
    .result-score { font-size: clamp(56px, 9vw, 96px); line-height: .95; letter-spacing: -.09em; font-weight: 900; color: var(--accent); }
    .result-hero h2 { margin: 14px 0 3px; font-size: 22px; letter-spacing: -.05em; }
    .result-hero p { margin: 0; color: var(--muted); }
    .result-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 25px auto 0; max-width: 790px; }
    .result-metric { background: var(--surface); padding: 14px 8px; }
    .result-metric strong { display: block; font-size: 20px; letter-spacing: -.05em; }
    .result-metric span { display: block; color: var(--muted); font-size: 10px; }
    .review-item { border: 1px solid var(--line); border-radius: 14px; padding: 17px; margin-bottom: 10px; }
    .review-item:last-child { margin-bottom: 0; }
    .review-item-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .review-item h4 { margin: 0 0 5px; font-size: 14px; }
    .review-answer { margin-top: 11px; display: grid; gap: 5px; font-size: 12px; }
    .answer-line { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
    .answer-line.correct { background: var(--success-soft); color: var(--success); }
    .answer-line.wrong { background: var(--danger-soft); color: var(--danger); }
    .topic-grid, .week-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .topic-card, .week-card { cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .topic-card:hover, .week-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
    .topic-card strong, .week-card strong { display: block; font-size: 14px; margin-bottom: 4px; }
    .topic-card p, .week-card p { color: var(--muted); font-size: 12px; margin: 0; }
    .topic-card .mini-bar, .week-card .mini-bar { margin-top: 15px; }
    .search-result { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .search-result:last-child { border-bottom: 0; }
    .search-result h4 { margin: 0 0 5px; font-size: 14px; }
    .search-result mark { background: color-mix(in srgb, var(--warning) 23%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; background: var(--surface-2); color: var(--muted); border-radius: 99px; font-size: 10px; font-weight: 750; }
    .tag.accent { color: var(--accent); background: var(--accent-soft); }
    .bar-chart { display: grid; gap: 13px; }
    .bar-line { display: grid; grid-template-columns: 120px 1fr 42px; gap: 10px; align-items: center; font-size: 12px; }
    .bar-line .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
    .bar-line .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: inherit; }
    .bar-line strong { font-size: 11px; text-align: right; }
    .chart-svg { width: 100%; height: 190px; display: block; }
    .chart-svg polyline { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-svg circle { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
    .chart-grid-line { stroke: var(--line); stroke-width: 1; }
    .file-input { display: none; }
    .notice { display: flex; gap: 11px; align-items: flex-start; padding: 14px 16px; border-radius: 13px; margin-bottom: 17px; background: var(--warning-soft); color: var(--warning); font-size: 12px; }
    .notice.error { background: var(--danger-soft); color: var(--danger); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(5, 12, 24, .48); display: grid; place-items: center; z-index: 60; padding: 18px; animation: fadeIn .18s ease; }
    .modal { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-md); padding: 24px; animation: rise .22s ease; }
    .modal h3 { margin: 0 0 6px; letter-spacing: -.035em; }
    .modal p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .toast-stack { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: grid; gap: 9px; width: min(360px, calc(100vw - 40px)); }
    .toast { background: var(--ink); color: var(--bg); border-radius: 11px; padding: 12px 14px; box-shadow: var(--shadow-md); font-size: 12px; animation: rise .2s ease; }
    .bottom-nav { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    @media (max-width: 1120px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .builder { grid-template-columns: 1fr; } }
    @media (max-width: 820px) { :root { --sidebar: 225px; } .topbar { padding: 0 20px; } .content { padding: 25px 20px 90px; } .topic-grid, .week-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .exam-grid { grid-template-columns: 1fr; } .navigator-card { position: static; } .hero-inner { align-items: flex-start; flex-direction: column; } .hero-meta { text-align: left; } .hero-meta strong { font-size: 30px; } }
    @media (max-width: 640px) { .sidebar { display: none; } .topbar { height: 68px; padding: 0 14px; gap: 9px; } .mobile-menu { display: grid; } .topbar-title { min-width: 0; } .topbar-title h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .topbar-title .eyebrow { font-size: 9px; } .search-global { display: none; } .content { padding: 21px 14px 86px; } .page-head { display: block; margin-bottom: 20px; } .page-head h2 { font-size: 29px; } .page-head .actions { margin-top: 15px; } .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } .topic-grid, .week-grid { grid-template-columns: 1fr; } .week-checks { grid-template-columns: repeat(3, minmax(0, 1fr)); } .result-metrics { grid-template-columns: repeat(2, 1fr); } .result-metric:last-child { grid-column: span 2; } .history-item { grid-template-columns: 1fr auto; gap: 7px; } .history-item .history-date { grid-column: 1; } .history-item .score-pill { grid-column: 2; grid-row: 1 / span 2; } .exam-top { align-items: flex-start; flex-direction: column; } .exam-status { justify-content: flex-start; } .question-card { min-height: 600px; padding: 17px; } .question-text { font-size: 21px; } .exam-controls { padding-top: 20px; } .mobile-nav-toggle { display: inline-flex; margin-bottom: 10px; } .exam-grid .navigator-card { display: none; } .exam-grid .navigator-card.mobile-open { display: block; position: fixed; left: 14px; right: 14px; bottom: 76px; top: auto; max-height: 72vh; overflow: auto; z-index: 42; box-shadow: var(--shadow-md); } .bottom-nav { position: fixed; display: grid; grid-template-columns: repeat(5, 1fr); bottom: 0; left: 0; right: 0; height: 65px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: 1px solid var(--line); z-index: 30; backdrop-filter: blur(15px); } .bottom-nav button { border: 0; background: none; color: var(--muted); font-size: 10px; display: grid; place-items: center; gap: 1px; } .bottom-nav button.active { color: var(--accent); font-weight: 800; } .bottom-nav .nav-icon { font-size: 16px; } .shortcuts { display: none; } }

  <script>
    "use strict";
    const q = (week, number, topic, question, options, answer, explanation, source) => ({
      id: `w${week}q${number}`, week, number, topic, question, options, answer,
      explanation, source, type: Array.isArray(answer) ? "multi" : "single"
    });
    const QUESTIONS = [
      // Week 1 · IoT foundations, addressing, sensing and actuation
      q(1,1,"IoT foundations","According to the ITU Internet Report 2005 discussed in the lecture, the future Internet is expected to become wider and more complex mainly because:",["Humans will completely stop using the Internet","Most Internet traffic may flow between devices and different kinds of things","Only desktop computers will remain connected","Internet communication will be restricted to email services"],1,"The ITU report describes a future where humans may become a minority as generators and receivers of traffic. Instead, communication will increasingly happen between devices and things, forming the Internet of Things.","Week 1 assignment · Lecture 1 @ 03:10"),
      q(1,2,"IoT characteristics","Which of the following are characteristics of IoT systems?",["Efficient and scalable architecture","Unambiguous naming and addressing","Presence of sleeping nodes, mobile nodes, and non-IP devices","Guaranteed continuous connectivity for every device at all times"],[0,1,2],"IoT systems require scalable architecture, clear naming and addressing, and support heterogeneous devices such as sleeping nodes, mobile nodes, and non-IP devices. Connectivity may be intermittent.","Week 1 assignment · Lecture 1 @ 06:05"),
      q(1,3,"Smart Dust","In the lecture, “Smart Dust” refers to:",["A cloud storage model for IoT data","A large-scale wireless router used in smart cities","Very tiny computing devices that can be sprayed or injected for sensing purposes","A type of IPv6 address used in IoT networks"],2,"Smart Dust refers to extremely small computing devices, smaller than a grain of sand, that can measure chemicals in soil or diagnose problems in the human body.","Week 1 assignment · Lecture 1 @ 10:40"),
      q(1,4,"M2M and IoT","Which statement best explains the relation between IoT and M2M communication?",["IoT and M2M are exactly the same","M2M is broader than IoT because it includes people and applications","M2M is a part of IoT, while IoT has a broader scope of interactions","IoT does not include machine-to-machine interaction"],2,"M2M focuses mainly on communication among machines and devices. IoT is broader because it includes interactions between things, people, applications, and systems.","Week 1 assignment · Lecture 1 @ 19:30"),
      q(1,5,"Web of Things","State whether the following statement is True or False. Statement: In the Web of Things, IoT sensors are replaced completely by cloud databases.",["True","False"],1,"The Web of Things does not replace sensors. Sensors remain responsible for collecting physical-world data, while web technologies help expose and access IoT resources.","Week 1 assignment · Lecture 1 @ 22:50"),
      q(1,6,"IoT addressing","In an IoT network configuration, local addresses may be valid only within a gateway’s domain. The same local address may even appear under another gateway. The main advantage of this strategy is:",["It increases unnecessary address consumption","It helps conserve address space","It removes the requirement of a gateway","It prevents any device from communicating with the Internet"],1,"Using locally valid addresses within a gateway’s domain allows address reuse across different gateway domains and avoids unnecessary wastage of global addresses.","Week 1 assignment · Lecture 2 @ 05:30"),
      q(1,7,"IoT gateways","Which of the following functions are associated with IoT gateways in the addressing strategy discussed in the lecture?",["Providing Internet connectivity","Supporting IoT LAN intra-connectivity","Obtaining upstream address prefixes using mechanisms such as DHCPv6","Delegating addresses to nodes using SLAAC"],[0,1,2,3],"IoT gateways can provide Internet connectivity and IoT LAN intra-connectivity. They may obtain upstream prefixes through DHCPv6 and delegate them to nodes using SLAAC.","Week 1 assignment · Lecture 2 @ 09:40"),
      q(1,8,"IPv6","Which of the following is true about IPv6 compared to IPv4?",["IPv6 uses dotted decimal notation","IPv6 has a smaller address space than IPv4","IPv6 uses hexadecimal notation and supports a much larger address space","IPv6 requires broadcast addresses in the same way as IPv4"],2,"IPv4 uses 32-bit addresses and dotted decimal notation, whereas IPv6 uses 128-bit addresses and hexadecimal notation.","Week 1 assignment · Lecture 2 @ 16:50"),
      q(1,9,"Sensing","Which statement correctly represents the design expectation from a good sensor?",["It should influence the measured property significantly","It should respond strongly to unrelated physical properties","It should be sensitive to the measured property and should not disturb it","It should always produce random output"],2,"A good sensor should measure the desired property, remain insensitive to unrelated properties, and should not influence or alter the measured quantity.","Week 1 assignment · Lecture 3 @ 13:00"),
      q(1,10,"Sensor resolution","Which of the following statements about sensor resolution are correct?",["Sensor resolution is the smallest change that the sensor can detect","For a digital sensor, resolution is related to the smallest digital output change it can process","Sensor resolution and sensor accuracy always refer to exactly the same property","Sensor accuracy does not depend only on resolution"],[0,1,3],"Resolution refers to the smallest detectable change. Accuracy and resolution are not the same; a high-resolution sensor may still be inaccurate because of bias or calibration errors.","Week 1 assignment · Lecture 3 @ 14:10"),
      q(1,11,"Sensors","State True or False. An accelerometer that measures acceleration along the x, y, and z coordinate axes is classified as a vector sensor.",["True","False"],0,"A vector sensor measures quantities with magnitude and direction or orientation. Acceleration components along x, y, and z make an accelerometer a vector sensor.","Week 1 assignment · Lecture 3 @ 18:40"),
      q(1,12,"Sensor errors","A sensor gives different output for the same input value depending on whether that input was reached by increasing or decreasing the measured quantity. This error is called:",["Quantization error","Hysteresis error","IPv6 translation error","Gateway prefix error"],1,"Hysteresis error occurs when the sensor output depends on previous input history.","Week 1 assignment · Lecture 3 @ 22:40"),
      q(1,13,"Actuation","State True or False. A hydraulic actuator can produce considerable force because liquids are nearly incompressible.",["False","True"],1,"Hydraulic actuators can exert large forces because their liquid working fluid is nearly incompressible.","Week 1 assignment · Lecture 4 @ 06:20"),
      q(1,14,"Actuation","Which of the following statements are correct about Shape Memory Polymer actuators?",["They may respond to stimuli such as light, heat, electrical, magnetic, pH, or moisture changes","They can show high strain recovery","They may have properties such as low density and biocompatibility","They are used only as passive temperature sensors"],[0,1,2],"Shape Memory Polymer actuators can respond to different stimuli and are known for low density, high strain recovery, biocompatibility, and biodegradability.","Week 1 assignment · Lecture 4 @ 18:20"),
      q(1,15,"IoT networking","State whether the following statement is True or False. According to the IoT implementation example discussed in the lecture, data gathered by a sensor travels through a gateway and a proxy server before arriving at the cloud server.",["True","False"],0,"In the example, data passes through the gateway and proxy server before reaching the cloud server for processing and analytics.","Week 1 assignment · Lecture 5 @ 07:30"),

      // Week 2 · IoT networking and connectivity
      q(2,1,"MQTT","In MQTT, which field of a published message is used by the broker as routing information?",["Topic","Client identifier","Payload length","Session timer"],0,"The topic included in a published message provides the routing information that the broker uses to deliver messages to matching subscribers.","Week 2 assignment · Module 6 @ 08:27"),
      q(2,2,"MQTT","Which of the following statements about MQTT topic wildcards are correct?",["The plus sign (+) matches an arbitrary value at exactly one hierarchy level.","The hash sign (#) can be used to subscribe to all underlying hierarchy levels.","The subscription house/# matches only the exact topic house.","The subscription house/+/temperature can match house/kitchen/temperature."],[0,1,3],"The plus sign (+) is a single-level wildcard, while the hash sign (#) is a multilevel wildcard. house/+/temperature can match house/kitchen/temperature, and house/# matches underlying topics.","Week 2 assignment · Module 6 @ 12:01"),
      q(2,3,"Secure MQTT","Which of the following are main stages of Secure MQTT (SMQTT)?",["Setup","Publish","Decryption","Route discovery"],[0,1,2],"SMQTT consists of setup, encryption, publish, and decryption. Route discovery is not one of the SMQTT stages.","Week 2 assignment · Module 6 @ 13:45"),
      q(2,4,"CoAP","At the transport layer, CoAP (Constrained Application Protocol) operates over which protocol?",["TCP","UDP","SCTP","FTP"],1,"CoAP is designed for constrained environments and operates over UDP at the transport layer.","Week 2 assignment · Module 7 @ 05:41"),
      q(2,5,"CoAP","State True or False. In CoAP, a piggyback response is carried with the acknowledgment, whereas in the separate mode, the server response is sent in a message separate from the acknowledgment.",["True","False"],0,"In piggyback mode, the response is placed in the acknowledgment. In separate mode, the acknowledgment is sent first and the response later as a separate message.","Week 2 assignment · Module 7 @ 07:48"),
      q(2,6,"CoAP","Which of the following CoAP request-method mappings are correct?",["GET - retrieve data","PUT - create data","PUSH - update data","DELETE - delete data"],[0,1,2,3],"As presented in the lecture, CoAP uses GET, PUT, PUSH, and DELETE to retrieve, create, update, and delete data, respectively.","Week 2 assignment · Module 7 @ 07:48"),
      q(2,7,"AMQP","Which AMQP frame type is used to control the message-flow rate?",["Transfer","Detach","Disposition","Flow"],3,"The Flow frame controls the rate of message flow between AMQP peers.","Week 2 assignment · Module 8 @ 06:21"),
      q(2,8,"AMQP","Which of the following statements about AMQP components are correct?",["An exchange receives messages and routes them to queues.","A queue stores messages for business processes or consumers.","A binding specifies message-distribution rules between an exchange and queues.","A consumer must route every producer message before it reaches an exchange."],[0,1,2],"An exchange routes messages, a queue stores messages, and a binding defines the distribution rules connecting exchanges to queues.","Week 2 assignment · Module 8 @ 08:03"),
      q(2,9,"IEEE 802.15.4","Which of the following IEEE 802.15.4 variant-application pairs are correct?",["IEEE 802.15.4c - China","IEEE 802.15.4e - Industrial applications","IEEE 802.15.4f - Active RFID","IEEE 802.15.4g - Smart utility networks"],[0,1,2,3],"The lecture associates 802.15.4c with China, 802.15.4e with industrial applications, 802.15.4f with active RFID, and 802.15.4g with smart utility networks.","Week 2 assignment · Module 9 @ 09:03"),
      q(2,10,"IEEE 802.15.4","In a non-beacon-enabled IEEE 802.15.4 network, data frames are transmitted using:",["Slotted CSMA/CA","Unslotted CSMA/CA","Token passing","Pure TDMA only"],1,"Non-beacon-enabled IEEE 802.15.4 networks transmit using unslotted CSMA/CA.","Week 2 assignment · Module 9 @ 14:11"),
      q(2,11,"ZigBee","Which statement correctly describes the relationship between IEEE 802.15.4 and ZigBee?",["IEEE 802.15.4 provides layers 1 and 2, while ZigBee extends the functionality to layer 3 and above.","ZigBee provides only the physical layer, while IEEE 802.15.4 provides all higher layers.","Both standards operate only at the application layer.","ZigBee and IEEE 802.15.4 are identical standards with no functional distinction."],0,"IEEE 802.15.4 specifies the physical and MAC layers. ZigBee operates on top and adds higher-layer functions such as routing, forwarding, authentication, and mesh support.","Week 2 assignment · Module 9 @ 16:08"),
      q(2,12,"ZigBee","Which of the following statements characterizes a ZigBee end device?",["It communicates with its parent node.","It cannot relay data for other devices.","It is a reduced-functionality device.","It forms the network root and acts as the trust center."],[0,1,2],"A ZigBee end device communicates with its parent but cannot relay data, so it is a reduced-functionality device. The coordinator forms the network root.","Week 2 assignment · Module 9 @ 23:54"),
      q(2,13,"6LoWPAN","Which option correctly describes addressing in 6LoWPAN?",["A 16-bit address is globally unique, while a 64-bit address is PAN-specific.","A 16-bit short address is PAN-specific and assigned by the PAN coordinator, while a 64-bit extended address is globally unique.","Both 16-bit and 64-bit addresses are globally unique and assigned by an Internet router.","Both address types are used only for multicast communication."],1,"6LoWPAN supports PAN-specific 16-bit short addresses assigned by the PAN coordinator and globally unique 64-bit extended addresses.","Week 2 assignment · Module 10 @ 04:58"),
      q(2,14,"LOADng","State True or False. In LOADng routing, an intermediate router may respond to a Route Request (RREQ) whenever it already has an active route to the requested destination.",["True","False"],1,"In LOADng, only the destination is permitted to respond to an RREQ. Intermediate routers are prohibited from responding.","Week 2 assignment · Module 10 @ 12:48"),
      q(2,15,"RFID","How does a passive RFID tag obtain the power required to transmit information?",["It uses its own internal battery.","It is powered inductively by an RFID reader.","It receives power through a wired AIDC connection.","It does not require any source of power."],1,"Passive RFID tags have no own power supply. They are powered inductively by an RFID reader before transmitting information.","Week 2 assignment · Module 10 @ 19:30"),

      // Week 3 · HART, NFC, Bluetooth, Z-Wave and sensor networks
      q(3,1,"HART","State whether the following statement is True or False. There is no network layer in Wired HART.",["True","False"],0,"There is no network layer in Wired HART.","Assignment Week 3 · Lecture 11 @ 05:22"),
      q(3,2,"Z-Wave","Z-Wave operates at ______ MHz in the US and ______ MHz in Europe.",["1008, 989","908.42, 868.42","767.56, 855.28","None of these"],1,"Z-Wave operates at 908.42 MHz in the US and 868.42 MHz in Europe.","Assignment Week 3 · Lecture 13 @ 03:40"),
      q(3,3,"Sensor networks","Dumb behavior of sensor nodes is _______________ in nature (as it is dependent on the effects of the environmental conditions).",["Temporal","Spatial","Both (a) and (b)","None of these"],0,"Dumb behavior of sensor nodes is temporal in nature because it depends on environmental conditions.","Assignment Week 3 · Lecture 15 @ 05:40"),
      q(3,4,"WirelessHART","The process of identifying channels consistently affected by interference and removing them from use is known as _________________.",["Channel Trimming","Channel Flushing","Both (a) and (b)","None of these"],3,"Channel blacklisting identifies channels consistently affected by interference and removes them from use. None of the named options is channel blacklisting.","Assignment Week 3 · Lecture 11 @ 07:30"),
      q(3,5,"NFC","The full form of NFC is",["Near Field Contact","Near Field Communication","Both (a) and (b)","Neither (a) nor (b)"],1,"The full form of NFC is Near Field Communication.","Assignment Week 3 · Lecture 11 @ 17:44"),
      q(3,6,"NFC","State True or False. NFC works on the principle of magnetic induction.",["True","False"],0,"NFC works on the principle of magnetic induction.","Assignment Week 3 · Lecture 11 @ 21:00"),
      q(3,7,"NFC","State whether the following statement is True or False. NFC tags found in supermarket products are examples of active NFC.",["True","False"],1,"Passive NFC tags found in supermarket products are examples of passive NFC.","Assignment Week 3 · Lecture 11 @ 18:47"),
      q(3,8,"Bluetooth","Bluetooth is based on ___________.",["Nanonets","Binarynets","Both (a) and (b)","None of these"],3,"Bluetooth is based on piconets.","Assignment Week 3 · Lecture 12 @ 01:55"),
      q(3,9,"NFC","A __________ in NFC emits a small electric current which creates a magnetic field that in turn bridges the physical space between the devices.",["Reader","Writer","Destroyer","None of these"],0,"An NFC reader emits a small electric current that creates a magnetic field bridging the physical space between devices.","Assignment Week 3 · Lecture 11 @ 20:31"),
      q(3,10,"Bluetooth","State True or False. Bluetooth technology is based on Ad-hoc network technology.",["False","True"],1,"Bluetooth technology is based on Ad-hoc network technology.","Assignment Week 3 · Lecture 12 @ 02:30"),
      q(3,11,"Z-Wave","State True or False. Z-Wave utilizes GFSK modulation and Hongkong channel encoding.",["True","False"],1,"Z-Wave utilizes GFSK modulation and Manchester channel encoding, not Hongkong channel encoding.","Assignment Week 3 · Lecture 13 @ 07:36"),
      q(3,12,"Z-Wave","The process of bypassing radio dead-spots is done using a message called ________ in Z-Wave.",["Ping","Healing","Frame","None of these"],1,"The process of bypassing radio dead-spots is done using a message called Healing in Z-Wave.","Assignment Week 3 · Lecture 13 @ 11:34"),
      q(3,13,"Sensor networks","State whether the following statement is True or False. Sensor nodes have unlimited battery life.",["True","False"],1,"Sensor nodes have limited battery life.","Assignment Week 3 · Lecture 14 @ 13:15"),
      q(3,14,"Bluetooth","State whether the following statement is True or False. The Link Manager Protocol in Bluetooth manages the establishment, authentication, link configuration.",["True","False"],0,"The Link Manager Protocol in Bluetooth manages establishment, authentication, and link configuration.","Assignment Week 3 · Page 157, Chapter 7, Introduction to IoT (2021)"),
      q(3,15,"ZigBee","ZigBee commonly uses __________ data rate.",["250 kbps","250 Mbps","260 kbps","260 Mbps"],0,"ZigBee commonly uses a 250 kbps data rate.","Assignment Week 3 · Page 131, Chapter 7, Introduction to IoT (2021)"),

      // Week 4 · Sensor networks and M2M
      q(4,1,"Sensor networks","What does the ultrasonic sensor measure generally in the AID system?",["Humidity","Distance of the object","Soil pH","Light intensity"],1,"In the Agricultural Intrusion Detection system, the ultrasonic sensor measures the distance at which the detected object is located.","Week 4 assignment · Lecture 16 @ 13:22"),
      q(4,2,"Sensor networks","Which component processes the data received from the sensors in the AID system?",["Camera","NFC tag","Microcontroller","Ultrasonic sensor"],2,"The microcontroller processes data received from sensors in the AID system.","Week 4 assignment · Lecture 16 @ 17:07"),
      q(4,3,"Nanodevices","How can standard nanodevices communicate?",["Electromagnetic communication","Molecular communication","Wired Ethernet","ZigBee communication"],[0,1],"The lecture discusses electromagnetic and molecular communication for nanodevices.","Week 4 assignment · Lecture 16 @ 25:11"),
      q(4,4,"Sensor networks","When does sensing coverage guarantee network connectivity?",["When the transmission range is at least twice the sensing range","When the sensing range is at least twice the transmission range","When the transmission and sensing ranges are equal","When the transmission range is smaller than the sensing range"],0,"Sensing coverage guarantees connectivity when the transmission range is at least twice the sensing range.","Week 4 assignment · Lecture 17 @ 04:14"),
      q(4,5,"WSN coverage","Which of the following is a coverage problem in a static WSN?",["Area coverage","Data compression","Route encryption","Clock synchronization"],0,"Area coverage is a standard coverage problem in a static wireless sensor network.","Week 4 assignment · Lecture 17 @ 11:30"),
      q(4,6,"WSN reporting","Which reporting method is used for forest-fire monitoring in a WSN?",["Event-driven reporting","On-demand reporting","Manual reporting","Location-based reporting"],0,"Forest-fire monitoring uses event-driven reporting because nodes report data when a fire-related event is detected.","Week 4 assignment · Lecture 17 @ 01:44"),
      q(4,7,"Data mule","What does a data mule do?",["Replaces all sensor nodes","Measures only temperature","Collects data and carries it to the sink","Repairs damaged hardware"],2,"A data mule visits sensor nodes, collects their data, and delivers it to the sink.","Week 4 assignment · Lecture 18 @ 07:15"),
      q(4,8,"WSN connectivity","What may happen if a critical stationary sensor node fails?",["The network may be partitioned","All nodes become mobile","The sensing range doubles","The network repairs itself by movement"],0,"Failure of a critical stationary node may divide the network into disconnected parts.","Week 4 assignment · Lecture 18 @ 00:43"),
      q(4,9,"Human-centric sensing","A person who provides sensing information acts as a:",["Router","Radio channel","Actuator","Data source"],3,"In human-centric sensing, a person may act as a data source by providing or collecting information.","Week 4 assignment · Lecture 18 @ 12:35"),
      q(4,10,"Stationary WSN","Which is an advantage of a stationary wireless sensor network?",["Easy topology maintenance","Automatic movement after node failure","Continuously changing topology","Unpredictable sensor locations"],0,"Stationary sensor nodes remain fixed, so deployment and topology maintenance are comparatively easier.","Week 4 assignment · Lecture 18 @ 00:43"),
      q(4,11,"UAV networks","State whether the following statement is True or False. In a UAV network, the network topology may change frequently because the UAVs are mobile.",["True","False"],0,"UAV movement causes frequent changes in relative positions and communication links, so topology may change frequently.","Week 4 assignment · Lecture 19 @ 05:23"),
      q(4,12,"UAV networks","Which is a common issue in UAV networks?",["Frequent topology changes","Fixed relative positions","Permanent communication links","No possibility of UAV failure"],0,"UAV movement causes frequent changes in network topology and communication links.","Week 4 assignment · Lecture 19 @ 05:23"),
      q(4,13,"M2M communication","Compared with traditional SCADA, M2M supports:",["Only isolated systems","No device communication","Continuous human control","Cross-platform integration"],3,"Traditional SCADA commonly uses isolated proprietary systems, while M2M supports cross-platform integration.","Week 4 assignment · Lecture 20 @ 04:28"),
      q(4,14,"Stationary WSN","State whether the following statement is True or False. In a stationary wireless sensor network, sensor nodes can automatically move to restore connectivity after a node failure.",["True","False"],1,"Stationary sensor nodes remain fixed and cannot move automatically to repair connectivity.","Week 4 assignment · Lecture 18 @ 00:43"),
      q(4,15,"M2M communication","Which statement best describes M2M communication?",["Devices can exchange data without direct human control","Every data exchange must be performed manually","Only one device can communicate at a time","Devices cannot communicate through a network"],0,"M2M communication allows machines or devices to exchange data automatically. Human intervention may still be needed for maintenance.","Week 4 assignment · Lecture 20 @ 09:24"),

      // Week 5 · Interoperability, Arduino and actuators
      q(5,1,"Interoperability","What does interoperability allow IoT devices to do?",["Communicate and exchange data","Work only offline","Use only one protocol","Disable other devices"],0,"Interoperability enables different IoT devices and systems to communicate and exchange data.","Week 5 assignment · Lecture 21 @ 03:30"),
      q(5,2,"Interoperability","Syntactic interoperability deals with:",["Message format","Battery size","Device colour","Sensor weight"],0,"Syntactic interoperability concerns the format of messages exchanged between devices and users.","Week 5 assignment · Lecture 21 @ 17:01"),

    ];

    const STORAGE_KEY = "iot-prep-studio-v1";
    const WEEK_LIST = Array.from({ length: 12 }, (_, index) => index + 1);
    const LETTERS = ["A", "B", "C", "D", "E", "F"];
    const VIEW_TITLES = {
      dashboard: "Your preparation", builder: "Build a mock", weeks: "Week explorer", "week-detail": "Week detail",
      topics: "Topic explorer", search: "Search questions", mistakes: "Mistake book", saved: "Saved questions",
      daily: "Daily challenge", analytics: "Performance analytics", settings: "Settings", session: "Active test", results: "Test results"
    };
    const DEFAULT_STATE = {
      theme: "light",
      bookmarks: [],
      mistakes: {},
      tests: [],
      currentTest: null,
      lastResult: null,
      daily: {},
      activityDays: [],
      builder: { weeks: WEEK_LIST.slice(), topic: "all", count: 20, mode: "practice", randomOptions: true },
      selectedWeek: null,
      selectedTopic: null,
      search: ""
    };
    let state = loadState();
    let view = "dashboard";
    let sessionTimer = null;
    let modalConfirm = null;

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || typeof saved !== "object") return structuredClone(DEFAULT_STATE);
        return {
          ...structuredClone(DEFAULT_STATE), ...saved,
          builder: { ...DEFAULT_STATE.builder, ...(saved.builder || {}) },
          bookmarks: Array.isArray(saved.bookmarks) ? saved.bookmarks : [],
          mistakes: saved.mistakes && typeof saved.mistakes === "object" ? saved.mistakes : {},
          tests: Array.isArray(saved.tests) ? saved.tests : [],
          activityDays: Array.isArray(saved.activityDays) ? saved.activityDays : [],
          daily: saved.daily && typeof saved.daily === "object" ? saved.daily : {}
        };
      } catch (error) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { /* offline storage can be unavailable in restricted browsers */ }
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));
    }
    function escapeRegExp(value) { return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
    function normalize(value) { return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
    function getQuestion(id) { return QUESTIONS.find(question => question.id === id); }
    function optionText(question, indices) {
      if (indices === null || indices === undefined || (Array.isArray(indices) && indices.length === 0)) return "Unanswered";
      const list = Array.isArray(indices) ? indices : [indices];
      return list.map(index => `${LETTERS[index] || "?"}. ${question.options[index] || "Unknown option"}`).join(" · ");
    }
    function answerArray(answer) {
      if (answer === null || answer === undefined) return [];
      return Array.isArray(answer) ? answer.slice().sort((a, b) => a - b) : [answer];
    }
    function hasAnswer(answer) { return answerArray(answer).length > 0; }
    function answersEqual(left, right) {
      const a = answerArray(left); const b = answerArray(right);
      return a.length === b.length && a.every((value, index) => value === b[index]);
    }
    function formatDate(timestamp, includeTime = false) {
      if (!timestamp) return "—";
      const date = new Date(timestamp);
      if (Number.isNaN(date.valueOf())) return "—";
      return new Intl.DateTimeFormat("en-GB", includeTime ? { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" } : { day: "2-digit", month: "short", year: "numeric" }).format(date);
    }
    function localDateKey(date = new Date()) {
      const year = date.getFullYear(); const month = String(date.getMonth() + 1).padStart(2, "0"); const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }
    function formatDuration(seconds) {
      const total = Math.max(0, Math.round(Number(seconds) || 0));
      const minutes = Math.floor(total / 60); const remainder = total % 60;
      return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }
    function pct(value) { return Number.isFinite(value) ? `${Math.round(value)}%` : "—"; }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function shuffle(items) {
      const copy = items.slice();
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }
    function seededNumber(seed) {
      let value = 2166136261;
      for (const character of seed) value = Math.imul(value ^ character.charCodeAt(0), 16777619);
      value += value << 13; value ^= value >>> 7; value += value << 3; value ^= value >>> 17; value += value << 5;
      return (value >>> 0) / 4294967296;
    }
    function seededPick(items, seed) {
      return items.slice().sort((a, b) => seededNumber(`${seed}:${a.id}`) - seededNumber(`${seed}:${b.id}`));
    }
    function addActivityDay() {
      const today = localDateKey();
      if (!state.activityDays.includes(today)) state.activityDays.push(today);
      state.activityDays = state.activityDays.slice(-400);
    }
    function getStreak() {
      const days = new Set(state.activityDays || []);
      let cursor = new Date(); let streak = 0;
      if (!days.has(localDateKey(cursor))) cursor.setDate(cursor.getDate() - 1);
      while (days.has(localDateKey(cursor))) { streak += 1; cursor.setDate(cursor.getDate() - 1); }
      return streak;
    }
    function showToast(message) {
      const stack = document.getElementById("toast-stack");
      const toast = document.createElement("div"); toast.className = "toast"; toast.textContent = message; stack.appendChild(toast);
      window.setTimeout(() => toast.remove(), 3200);
    }

    function validateDataset() {
      const errors = []; const seenIds = new Set(); const textCounts = new Map();
      QUESTIONS.forEach(question => {
        if (!question.id || seenIds.has(question.id)) errors.push(`${question.id || "unknown"}: duplicate or missing id`);
        seenIds.add(question.id);
        const expectedId = `w${question.week}q${question.number}`;
        if (question.id !== expectedId) errors.push(`${question.id}: id does not match week/question number`);
        if (!Number.isInteger(question.week) || question.week < 1 || question.week > 12) errors.push(`${question.id}: invalid week`);
        if (!question.topic || !question.question || !Array.isArray(question.options) || question.options.length < 2) errors.push(`${question.id}: missing topic, text or options`);
        const answerValues = answerArray(question.answer);
        if (!answerValues.length || answerValues.some(index => !Number.isInteger(index) || index < 0 || index >= question.options.length)) errors.push(`${question.id}: invalid answer`);
        if (!question.source) errors.push(`${question.id}: missing source attribution`);
        const normalizedText = normalize(question.question);
        textCounts.set(normalizedText, (textCounts.get(normalizedText) || 0) + 1);
      });
      const duplicates = [...textCounts.entries()].filter(([, count]) => count > 1).map(([text, count]) => ({ text, count }));
      if (QUESTIONS.length !== 180) errors.push(`Expected 180 questions, found ${QUESTIONS.length}`);
      return { errors, duplicates, total: QUESTIONS.length, valid: errors.length === 0 };
    }
    const DATA_REPORT = validateDataset();
    const TOPICS = [...new Set(QUESTIONS.map(question => question.topic))].sort((a, b) => a.localeCompare(b));

    function allResponses() {
      return state.tests.flatMap(test => Array.isArray(test.items) ? test.items.map(item => ({ ...item, test })) : []);
    }
    function getGroupedStats(key) {
      const groups = new Map();
      allResponses().forEach(item => {
        const question = getQuestion(item.id); if (!question) return;
        const value = question[key];
        if (!groups.has(value)) groups.set(value, { total: 0, answered: 0, correct: 0, attemptedIds: new Set() });
        const group = groups.get(value); group.total += 1;
        if (hasAnswer(item.userAnswer)) { group.answered += 1; group.attemptedIds.add(question.id); if (item.correct) group.correct += 1; }
      });
      return groups;
    }
    function getStats() {
      const responses = allResponses(); const answered = responses.filter(item => hasAnswer(item.userAnswer));
      const attemptedIds = new Set(answered.map(item => item.id));
      const correct = answered.filter(item => item.correct).length;
      const scores = state.tests.map(test => Number(test.scorePct)).filter(Number.isFinite);
      const weekStats = getGroupedStats("week"); const topicStats = getGroupedStats("topic");
      const evaluatedWeeks = [...weekStats.entries()].filter(([, item]) => item.answered > 0).map(([week, item]) => ({ week: Number(week), accuracy: item.correct / item.answered * 100, ...item }));
      const evaluatedTopics = [...topicStats.entries()].filter(([, item]) => item.answered > 0).map(([topic, item]) => ({ topic, accuracy: item.correct / item.answered * 100, ...item }));
      const strongest = evaluatedWeeks.length ? evaluatedWeeks.slice().sort((a, b) => b.accuracy - a.accuracy || b.answered - a.answered)[0] : null;
      const weakest = evaluatedWeeks.length ? evaluatedWeeks.slice().sort((a, b) => a.accuracy - b.accuracy || b.answered - a.answered)[0] : null;
      return {
        total: QUESTIONS.length, attempted: attemptedIds.size, remaining: Math.max(0, QUESTIONS.length - attemptedIds.size),
        accuracy: answered.length ? correct / answered.length * 100 : null, correct, answered: answered.length,
        best: scores.length ? Math.max(...scores) : null, average: scores.length ? scores.reduce((sum, value) => sum + value, 0) / scores.length : null,
        tests: state.tests.length, progress: QUESTIONS.length ? attemptedIds.size / QUESTIONS.length * 100 : 0,
        weekStats, topicStats, evaluatedWeeks, evaluatedTopics, strongest, weakest, streak: getStreak()
      };
    }
    function scoreClass(score) { return score >= 80 ? "" : score >= 50 ? "mid" : "low"; }
    function emptyState(icon, title, message, action = "", actionLabel = "") {
      return `<div class="empty"><div class="empty-icon">${icon}</div><h4>${escapeHTML(title)}</h4><p>${escapeHTML(message)}</p>${action ? `<button class="btn secondary small" data-action="${action}">${escapeHTML(actionLabel)}</button>` : ""}</div>`;
    }
    function dataNotice() {
      if (DATA_REPORT.valid) return "";
      return `<div class="notice error"><strong>Data validation needs attention.</strong><span>${escapeHTML(DATA_REPORT.errors.join(" · "))}</span></div>`;
    }
    function updateTheme() {
      document.documentElement.dataset.theme = state.theme === "dark" ? "dark" : "light";
      const button = document.getElementById("theme-toggle"); if (button) button.textContent = state.theme === "dark" ? "☀" : "☾";
    }
    function activeNav() {
      document.querySelectorAll("[data-nav]").forEach(button => button.classList.toggle("active", button.dataset.nav === view || (view === "week-detail" && button.dataset.nav === "weeks")));
    }
    function setView(next) {
      view = next; if (next !== "session") stopSessionTimer(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function stopSessionTimer() { if (sessionTimer) { window.clearInterval(sessionTimer); sessionTimer = null; } }
    function getSessionElapsed(session) {
      if (!session) return 0;
      const start = Number(session.startedAt) || Date.now();
      return Math.max(0, Number(session.elapsedBefore) || 0) + (Date.now() - start) / 1000;
    }
    function persistCurrentElapsed() {
      if (!state.currentTest) return;
      const session = state.currentTest; session.elapsedBefore = getSessionElapsed(session); session.startedAt = Date.now(); persist();
    }
    function startSessionTimer() {
      stopSessionTimer();
      const session = state.currentTest; if (!session || !session.duration) return;
      const tick = () => {
        const active = state.currentTest; if (!active) return;
        const elapsed = getSessionElapsed(active); const remaining = Math.max(0, active.duration - elapsed);
        const timer = document.getElementById("session-timer"); if (timer) { timer.textContent = formatDuration(remaining); timer.classList.toggle("warn", remaining <= 60); }
        if (remaining <= 0) { stopSessionTimer(); finishSession(true, "time"); }
      };
      tick(); sessionTimer = window.setInterval(tick, 1000);
    }
    window.addEventListener("beforeunload", persistCurrentElapsed);

    function makeSession(questionIds, mode = "practice", options = {}) {
      const ids = questionIds.filter(id => getQuestion(id));
      const randomOptions = options.randomOptions !== false;
      const optionOrders = {};
      ids.forEach(id => {
        const question = getQuestion(id); const indices = question.options.map((_, index) => index);
        optionOrders[id] = randomOptions ? shuffle(indices) : indices;
      });
      state.currentTest = {
        id: `test-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        questionIds: ids, mode, kind: options.kind || "mock", label: options.label || `${mode === "exam" ? "Exam" : "Practice"} mock`,
        dailyKey: options.dailyKey || null, answers: {}, marked: [], checked: {}, optionOrders,
        currentIndex: 0, randomOptions, startedAt: Date.now(), elapsedBefore: 0,
        duration: mode === "exam" ? Math.max(300, ids.length * 60) : 0
      };
      addActivityDay(); persist(); view = "session"; render(); startSessionTimer();
    }
    function getCurrentQuestion() {
      const session = state.currentTest; if (!session) return null;
      return getQuestion(session.questionIds[clamp(Number(session.currentIndex) || 0, 0, Math.max(0, session.questionIds.length - 1))]);
    }
    function getOptionOrder(question, session) { return session?.optionOrders?.[question.id] || question.options.map((_, index) => index); }
    function getSelected(session, question) { return session?.answers?.[question.id] || []; }
    function setSelected(session, question, originalIndex) {
      const current = answerArray(session.answers[question.id]);
      if (question.type === "multi") {
        session.answers[question.id] = current.includes(originalIndex) ? current.filter(value => value !== originalIndex) : [...current, originalIndex].sort((a, b) => a - b);
      } else session.answers[question.id] = [originalIndex];
      delete session.checked[question.id];
      persist(); render();
    }
    function markCurrent() {
      const session = state.currentTest; const question = getCurrentQuestion(); if (!session || !question) return;
      session.marked = session.marked.includes(question.id) ? session.marked.filter(id => id !== question.id) : [...session.marked, question.id];
      persist(); render();
    }
    function clearCurrent() {
      const session = state.currentTest; const question = getCurrentQuestion(); if (!session || !question) return;
      delete session.answers[question.id]; delete session.checked[question.id]; persist(); render();
    }
    function moveQuestion(step) {
      const session = state.currentTest; if (!session) return;
      const next = Number(session.currentIndex) + step;
      if (next >= session.questionIds.length) { if (session.mode === "practice") finishSession(false); else submitRequest(); return; }
      if (next < 0) return;
      session.currentIndex = next; persist(); render();
    }
    function checkPractice() {
      const session = state.currentTest; const question = getCurrentQuestion(); if (!session || !question || session.mode !== "practice") return;
      if (!hasAnswer(getSelected(session, question))) { showToast("Choose an answer before checking."); return; }
      session.checked[question.id] = true; persist(); render();
    }
    function submitRequest() {
      const session = state.currentTest; if (!session) return;
      const items = session.questionIds.map(id => ({ id, userAnswer: session.answers[id] || null }));
      const attempted = items.filter(item => hasAnswer(item.userAnswer)).length; const marked = session.marked.length; const unanswered = items.length - attempted;
      showConfirm("Submit your test?", `Attempted: ${attempted}/${items.length} · Unanswered: ${unanswered} · Marked for review: ${marked}`, "Submit test", () => finishSession(true, "submitted"));
    }
    function finishSession(force = false, reason = "submitted") {
      const session = state.currentTest; if (!session) return;
      if (!force && session.mode === "exam") { submitRequest(); return; }
      stopSessionTimer();
      const items = session.questionIds.map(id => {
        const question = getQuestion(id); const userAnswer = session.answers[id] || null; const unanswered = !hasAnswer(userAnswer);
        return { id, userAnswer, correct: !unanswered && answersEqual(userAnswer, question.answer), unanswered };
      });
      const correct = items.filter(item => item.correct).length; const attempted = items.filter(item => !item.unanswered).length;
      const result = {
        id: session.id, label: session.label, mode: session.mode, kind: session.kind, dailyKey: session.dailyKey,
        questionIds: session.questionIds.slice(), items, marked: session.marked.slice(), correct,
        attempted, unanswered: items.length - attempted, total: items.length,
        scorePct: items.length ? correct / items.length * 100 : 0, accuracyPct: attempted ? correct / attempted * 100 : 0,
        timeTaken: getSessionElapsed(session), reason, submittedAt: Date.now()
      };
      state.tests = [result, ...state.tests].slice(0, 250); state.lastResult = result; state.currentTest = null;
      items.filter(item => !item.unanswered && !item.correct).forEach(item => {
        const question = getQuestion(item.id); const previous = state.mistakes[item.id] || { count: 0 };
        state.mistakes[item.id] = { id: item.id, count: previous.count + 1, lastAttempt: Date.now(), userAnswer: item.userAnswer, correctAnswer: answerArray(question.answer), week: question.week, topic: question.topic };
      });
      if (session.dailyKey) state.daily[session.dailyKey] = { ...result, completed: true };
      addActivityDay(); persist(); view = "results"; render();
      showToast(reason === "time" ? "Time is up. Your test was submitted." : "Test submitted. Your result is ready.");
    }

omise answer options</strong><small class="muted" style="display:block">Questions remain faithful; only option order changes.</small></span><input type="checkbox" name="randomOptions" ${builder.randomOptions !== false ? "checked" : ""} style="accent-color:var(--accent);width:18px;height:18px"></label><div class="notice" style="margin:18px 0 0"><strong>Difficulty labels are not present in the PDFs.</strong><span>They are intentionally not invented or offered here.</span></div><button class="btn primary" type="submit" style="margin-top:18px;width:100%">Generate mock</button></form><aside class="card"><div class="section-title" style="margin-top:0"><h3>What you’ll get</h3></div><div class="selection-summary"><div class="summary-line"><span>Mode</span><strong>${builder.mode === "exam" ? "Timed exam" : "Guided practice"}</strong></div><div class="summary-line"><span>Source</span><strong>Weeks 1–12</strong></div><div class="summary-line"><span>Answer key</span><strong>Hidden in exam mode</strong></div><div class="summary-line"><span>Persistence</span><strong>Saved locally</strong></div></div><div style="margin-top:24px" class="muted small-text">Your current session is never silently submitted. If you leave, it stays available in “Continue where I left off”.</div></aside></div>`;

    function renderWeeks() {
      return `<div class="page-head"><div><div class="eyebrow">Source map</div><h2>Explore all 12 weeks.</h2><p>Open a week to see its actual topics, question coverage and a focused practice option.</p></div><div class="actions"><button class="btn primary" data-action="start-full">Practice all questions</button></div></div><div class="week-grid">${WEEK_LIST.map(week => { const qs = QUESTIONS.filter(question => question.week === week); const stats = getStats().weekStats.get(week); const accuracy = stats?.answered ? stats.correct / stats.answered * 100 : null; return `<button class="card week-card" data-action="week-detail" data-week="${week}" style="text-align:left"><strong>Week ${week}</strong><p>${qs.length} questions · ${stats?.attemptedIds.size || 0} attempted</p><div class="mini-bar progress" style="margin-top:15px"><span style="width:${accuracy || 0}%"></span></div><div class="progress-row" style="margin-top:7px;margin-bottom:0"><span>${accuracy === null ? "Not attempted" : `${pct(accuracy)} accuracy`}</span><span>${stats?.correct || 0}/${stats?.answered || 0}</span></div></button>`; }).join("")}</div>`;

    function makePolyline(values, width = 600, height = 170) {
